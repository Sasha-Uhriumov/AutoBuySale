spring:
  application:
    name: AutoBuySale

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${db_name}}
    username: ${DB_USER:${postgres_user}}
    password: ${DB_PASSWORD:${postgres_password}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8080